<div class="bg-white border rounded-xl h-full w-full flex flex-col">
   <!-- Fixed Header -->
   <div class="flex justify-between sm:rounded-tr-xl sm:rounded-tl-xl items-center px-5 sm:py-4 py-3 bg-white sticky top-0 z-10 border-b border-gray-300">
    <h1 class="sm:text-2xl font-bold">Recipts</h1>
    <div class="flex gap-3">
      <img class="cursor-pointer w-6 h-6" src="/notifications.svg" alt="notification">
      <img class="cursor-pointer w-6 h-6" src="/account-circle.svg" alt="profile">
    </div>
  </div>

  <div class=" border">
    
    <!-- Last Sync -->
    <div class="flex sm:flex-row flex-col m-5 sm:justify-between sm:items-center mb-2">
      <div class="text-gray-500 text-sm mb-4">
        Last Sync: 23rd August 2024 <a href="#" class="text-blue-500 underline">Sync All Email Accounts</a>
      </div>
      <div class="flex space-x-4">
        <button class="px-4 py-2 bg-blue-500 text-white rounded-lg">+ Add Receipt</button>
        <button class="px-4 py-2 bg-blue-600 text-white rounded-lg">⬇ Export</button>
      </div>
    </div>
    
  
    <!-- Filters -->
    <div class="  mx-5 flex space-x-2 mb-1">
      <input type="text" placeholder="🔍 Search" class="border px-3 py-2 rounded-lg w-1/3">
      <select class="border px-3 py-2 rounded-lg">
        <option>Select date</option>
      </select>
      <select class="border px-3 py-2 rounded-lg">
        <option>Status</option>
      </select>
      <select class="border px-3 py-2 rounded-lg">
        <option>Vendor</option>
      </select>
      <button class="border px-3 py-2 rounded-lg flex items-center">
        More Filter <span class="ml-1">⚙</span>
      </button>
    </div>
  
    <!-- Table -->
    <div class="overflow-auto flex-1 m-5 mb-0.5 border rounded-lg">
      <table class="w-full text-left">
        <thead class="border-b bg-gray-100">
          <tr>
            <th class="py-2 px-4"><input type="checkbox"></th>
            <th class="py-2 px-4">Vendor</th>
            <th class="py-2 px-4">Date ⬇</th>
            <th class="py-2 px-4">Amount ⬆</th>
            <th class="py-2 px-4">Categories</th>
            <th class="py-2 px-4">Source</th>
            <th class="py-2 px-4">Status</th>
            <th class="py-2 px-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let receipt of receipts" class="border-b">
            <td class="py-2 px-4"><input type="checkbox"></td>
            <td class="py-2 px-4">{{ receipt.vendor }}</td>
            <td class="py-2 px-4">{{ receipt.date }}</td>
            <td class="py-2 px-4">${{ receipt.amount }}</td>
            <td class="py-2 px-4">
              <span [ngClass]="getCategoryClass(receipt.category)" class=" px-2 py-1 rounded">{{ receipt.category }}</span>
            </td>
            <td class="py-2 px-4">{{ receipt.source }}</td>
            <td class="py-2 px-4">
              <span class="px-2 py-1 rounded" [ngClass]="getStatusClass(receipt.status)">
                {{ receipt.status }}
              </span>
            </td>
            <td class="py-2 px-4">
              <button class="text-gray-600">⋮</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <!-- Pagination -->
    <div class="flex justify-between items-center mx-5 my-2">
      <p class="text-gray-500">Page 1 of 10</p>
      <div class="flex space-x-2">
        <button class="px-4 py-2 border rounded-lg text-gray-600">Previous</button>
        <button class="px-4 py-2 border rounded-lg text-gray-600">Next</button>
      </div>
    </div>
  </div>
</div>
