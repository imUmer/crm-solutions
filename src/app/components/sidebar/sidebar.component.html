<!-- Mobile Toggle Button -->
<button class="md:hidden fixed top-4 left-4 bg-blue-500 text-white p-2 rounded"
        (click)="toggleMobileSidebar()">☰</button>

<!-- Mobile Sidebar Overlay -->
<div *ngIf="isMobileSidebarOpen" class="fixed inset-0 bg-black bg-opacity-50" (click)="toggleMobileSidebar()"></div>

<!-- Sidebar Container -->
<div [ngClass]="{'w-64': isSidebarOpen, 'w-16': !isSidebarOpen}"
     class="bg-gray-50 h-full flex flex-col transition-all duration-300 fixed md:relative">
     
     
     <div class="flex justify-between items-center space-x-5 mt-5 gap-3" >
      <!-- Logo (Hidden when Sidebar is Closed) -->
        <span class="px-5 py-2 text-2xl font-bold italic text-blue-600" [ngClass]="{ 'hidden': !isSidebarOpen }">SpendTrack</span>
        
      <!-- Sidebar Toggle Button (Always Visible) -->
      <button
        class="hidden md:flex items-center border p-2 px-2 py-2 cursor-pointer rounded-lg text-gray-700 hover:bg-white hover:shadow-md"
        (click)="toggleSidebar()"
        aria-label="Toggle Sidebar"
      >
        <img
          [src]="isSidebarOpen ? '/arrow_menu_close_black.svg' : '/arrow_menu_open_black.svg'"
          alt="Toggle Sidebar"
          class="w-6 h-6"
        >
      </button>
    </div>
    


  <!-- Navigation Links -->
  <nav [ngClass]="{'flex': !isSidebarOpen}" class="flex-1 px-4 py-6 space-y-2">
    <ul class="space-y-1">
      <li>
        <a routerLink="/dashboard" routerLinkActive="bg-blue-100"
           class="flex cursor-pointer items-center px-4 py-3 rounded-lg text-gray-700 hover:bg-white hover:shadow-md">
          <span>📊</span>
          <span *ngIf="isSidebarOpen" class="ml-3 text-nowrap">Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="/receipts" routerLinkActive="bg-blue-100"
           class="flex cursor-pointer items-center px-4 py-3 rounded-lg text-gray-700 hover:bg-white hover:shadow-md">
          <span>🧾</span>
          <span *ngIf="isSidebarOpen" class="ml-3 text-nowrap">Receipts</span>
        </a>
      </li>
      <li>
        <a routerLink="/email" routerLinkActive="bg-blue-100"
           class="flex cursor-pointer items-center px-4 py-3 rounded-lg text-gray-700 hover:bg-white hover:shadow-md">
          <span>📧</span>
          <span *ngIf="isSidebarOpen" class="ml-3 text-nowrap">Email Accounts</span>
        </a>
      </li>
      <li>
        <a routerLink="/settings" routerLinkActive="bg-blue-100"
           class="flex cursor-pointer items-center px-4 py-3 rounded-lg text-gray-700 hover:bg-white hover:shadow-md">
          <span>⚙️</span>
          <span *ngIf="isSidebarOpen" class="ml-3 text-nowrap">User Settings</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Logout Button -->
  <div  [ngClass]="{'flex w-fit': !isSidebarOpen}" class="mt-auto px-4 py-6 space-y-2">
    <button  class="w-full flex items-center px-4 py-3 rounded-lg text-red-500 hover:bg-red-100 hover:shadow-md">
      <span>🚪</span>
      <span *ngIf="isSidebarOpen" class="ml-3">Logout</span>
    </button>
  </div>
</div>
