<!-- Sidebar Container -->
<div class="w-64 bg-gray-50 shadow-lg h-full flex flex-col">
  <!-- Logo -->
  <div class="p-6 text-2xl font-bold text-blue-600 border-b">
    Spendflow
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 px-4 py-6 space-y-2 gap-3">
    <ul class="space-y-1">
      <li>
        <a routerLink="/dashboard" routerLinkActive="bg-blue-100"
           class="flex items-center px-4 py-3 rounded-lg text-gray-700 hover:bg-white hover:shadow-md">
          <span>📊</span>
          <span class="ml-3">Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="/receipts" routerLinkActive="bg-blue-100"
           class="flex items-center px-4 py-3 rounded-lg text-gray-700 hover:bg-white hover:shadow-md">
          <span>🧾</span>
          <span class="ml-3">Receipts</span>
        </a>
      </li>
      <li>
        <a routerLink="/email" routerLinkActive="bg-blue-100"
           class="flex items-center px-4 py-3 rounded-lg text-gray-700 hover:bg-white hover:shadow-md">
          <span>📧</span>
          <span class="ml-3">Email Accounts</span>
        </a>
      </li>
      <li>
        <a routerLink="/whatsapp" routerLinkActive="bg-blue-100"
           class="flex items-center px-4 py-3 rounded-lg text-gray-700 hover:bg-white hover:shadow-md">
          <span>📱</span>
          <span class="ml-3">WhatsApp Scanner</span>
        </a>
      </li>
      <li>
        <a routerLink="/settings" routerLinkActive="bg-blue-100"
           class="flex items-center px-4 py-3 rounded-lg text-gray-700 hover:bg-white hover:shadow-md">
          <span>⚙️</span>
          <span class="ml-3">User Settings</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Logout Button (Fixed at Bottom) -->
  <div class="mt-auto p-4 border-t">
    <button class="w-full flex items-center px-4 py-3 rounded-lg text-red-500 hover:bg-red-100 hover:shadow-md">
      <span>🚪</span>
      <span class="ml-3">Logout</span>
    </button>
  </div>
</div>

<button class="md:hidden fixed top-4 left-4 bg-blue-500 text-white p-2 rounded"
        (click)="toggleSidebar()">☰</button>

<div *ngIf="isSidebarOpen" class="fixed inset-0 bg-black bg-opacity-50" (click)="toggleSidebar()"></div>
